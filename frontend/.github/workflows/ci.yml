name: CI

# Runs on every pull request into master. A PR can't be merged until this passes
# (once it's marked as a required status check in branch protection).
on:
  pull_request:
    branches: [ master ]

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (type-check + production build)
        run: npm run build
