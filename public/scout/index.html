<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0f172a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <link rel="manifest" href="/scout/manifest.webmanifest" />
  <link rel="apple-touch-icon" href="/trc_2.png" />
  <link rel="stylesheet" href="/scout/styles.css" />
  <title>TRC Scout</title>
</head>
<body>
  <div class="app">
    <header>
      <h1>TRC Scout</h1>
      <span id="syncBadge" class="sync-badge" hidden>0</span>
      <span id="netStatus" class="status">…</span>
    </header>
    <main id="view"><p class="muted">Loading…</p></main>
    <nav class="bottom" id="nav" hidden>
      <button data-route="home" class="on">Home</button>
      <button data-route="teams">Teams</button>
      <button data-route="watch">Watch</button>
      <button data-route="match">Match</button>
      <button data-route="pit">Pit</button>
      <button data-route="sync">Sync</button>
    </nav>
  </div>
  <script type="module" src="/scout/app.js"></script>
</body>
</html>
